<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Lube — Executive Command Center</title>
<style>
/* ================= TOKENS ================= */
:root{
  --page:#0b0c0e; --surface:#121316; --raised:#17181c; --hairline:#24262b;
  --ink:#e8eaed; --ink-2:#9aa1ac; --ink-3:#5f6672;
  --accent:#3987e5;
  /* validated categorical (dark surface) — fixed entity order, never cycled */
  --s-foodlube:#3987e5; --s-knorr:#199e70; --s-btb:#c98500;
  --s-pacific:#9085e9; --s-kettlefire:#e66767; --s-imagine:#008300;
  --s-other:#33363c;
  /* status (reserved — never used as series) */
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --grid:#1e2025;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

/* ================= TICKER ================= */
.ticker{position:sticky;top:0;z-index:50;display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  background:#08090b;border-bottom:1px solid var(--hairline);font-family:var(--mono);font-size:11.5px}
.ticker::-webkit-scrollbar{display:none}
.tick{display:flex;align-items:baseline;gap:7px;padding:6px 15px;border-right:1px solid #17181c;white-space:nowrap}
.tick .sym{color:var(--ink-3);letter-spacing:.08em;font-size:10px}
.tick .val{color:var(--ink);font-variant-numeric:tabular-nums}
.tick .chg{font-variant-numeric:tabular-nums;font-size:11px}
.chg.up{color:var(--good)} .chg.dn{color:var(--critical)} .chg.flat{color:var(--ink-3)}
.tick.flash .val{color:#fff}

/* ================= HEADER + NAV ================= */
header{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--hairline);flex-wrap:wrap}
.wordmark{display:flex;align-items:center;gap:10px}
.wordmark .block{width:24px;height:24px;border-radius:var(--r);background:#1c5cab;
  display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;color:#fff}
.wordmark h1{font-size:14.5px;font-weight:650;letter-spacing:.02em}
.wordmark h1 span{color:var(--ink-3);font-weight:400}
.pack{display:flex;align-items:center;gap:8px;margin-left:6px}
.pack label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.pack select{background:var(--raised);color:var(--ink);border:1px solid var(--hairline);border-radius:var(--r);
  padding:4px 8px;font:inherit;font-size:12px}
.hspace{flex:1}
.tool-btn{padding:3px 10px;border:1px solid var(--hairline);border-radius:var(--r);color:var(--ink-2);font-size:11px;font-family:var(--mono)}
.tool-btn:hover{background:var(--raised);color:var(--ink)}
.clock{font-family:var(--mono);font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--good)}
nav.tabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--hairline);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}

/* ================= FILTER ROW ================= */
.filters{display:flex;align-items:center;gap:8px;padding:12px 22px 0;flex-wrap:wrap}
.filters .flabel{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.range-btn{padding:3px 11px;border:1px solid var(--hairline);border-radius:var(--r);color:var(--ink-2);font-size:11.5px;font-family:var(--mono)}
.range-btn:hover{background:var(--raised)}
.range-btn.on{background:var(--raised);color:var(--ink);border-color:#3a3e46;font-weight:600}
.asof{margin-left:auto;font-size:11px;color:var(--ink-3);font-family:var(--mono)}

/* ================= LAYOUT ================= */
.shell{display:grid;grid-template-columns:minmax(0,1fr) 324px;gap:14px;padding:14px 22px 40px;max-width:1560px;margin:0 auto}
.shell.full{grid-template-columns:1fr;max-width:1240px}
@media (max-width:1100px){.shell{grid-template-columns:1fr}.rail{position:static !important;max-height:none !important}}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:14px 16px;min-width:0}
.card-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.card-head h2{font-size:11.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.card-head .sub{font-size:11px;color:var(--ink-3)}
.tbl-toggle{margin-left:auto;font-size:10.5px;color:var(--ink-3);border:1px solid var(--hairline);border-radius:var(--r);padding:2px 8px;font-family:var(--mono)}
.tbl-toggle:hover{color:var(--ink-2);background:var(--raised)}

/* ================= HERO + KPI ROW ================= */
.hero-row{display:grid;grid-template-columns:minmax(250px,1.2fr) repeat(4,minmax(150px,1fr));gap:14px}
@media (max-width:1350px){.hero-row{grid-template-columns:repeat(2,1fr)}}
.hero .lbl,.tile .lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.hero .big{font-size:40px;font-weight:650;line-height:1;letter-spacing:-.01em}
.hero .big .unit{font-size:18px;color:var(--ink-2);font-weight:500;margin-left:2px}
.hero .vs{margin-top:10px;font-size:12px;color:var(--ink-2)}
.delta{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)} .delta.dn{color:var(--critical)}
.tile .val{font-size:22px;font-weight:650;line-height:1.1}
.tile .val .unit{font-size:13px;color:var(--ink-2);font-weight:500}
.tile .meta{margin-top:6px;font-size:11px;color:var(--ink-3)}
.tile svg{display:block;margin-top:9px}

/* ================= CHART CHROME ================= */
.plot-wrap{position:relative}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:7px 0 2px;font-size:11px;color:var(--ink-2)}
.legend .key{display:inline-flex;align-items:center;gap:6px}
.key .swatch{width:8px;height:8px;border-radius:2px;flex:none}
.key .line-key{width:14px;height:2px;border-radius:1px;flex:none}
.tooltip{position:absolute;pointer-events:none;background:#1b1d22;border:1px solid #31343c;border-radius:var(--r);
  padding:8px 11px;font-size:11.5px;box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:20;min-width:150px;display:none}
.tooltip .tt-date{font-family:var(--mono);color:var(--ink-3);font-size:10px;margin-bottom:5px}
.tooltip .tt-row{display:flex;align-items:center;gap:7px;margin-top:3px}
.tooltip .tt-row .v{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums}
.viz-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.viz-table th{text-align:right;color:var(--ink-3);font-weight:500;padding:5px 9px;border-bottom:1px solid var(--hairline);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
.viz-table th:first-child,.viz-table td:first-child{text-align:left}
.viz-table td{padding:5px 9px;border-bottom:1px solid var(--grid);font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.viz-table td:first-child{font-family:var(--sans);color:var(--ink)}
.hidden{display:none !important}
.provenance{margin-top:9px;font-size:10.5px;color:var(--ink-3);border-top:1px solid var(--grid);padding-top:8px}

/* ================= SCORECARDS ================= */
.dept-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1350px){.dept-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.dept-grid{grid-template-columns:1fr}}
.dept{cursor:pointer;transition:border-color .12s}
.dept:hover{border-color:#3a3e46}
.dept .dept-top{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.dept .dept-top h3{font-size:12px;font-weight:650}
.dept .score{margin-left:auto;font-family:var(--mono);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.meter{height:3px;border-radius:2px;margin-bottom:12px;position:relative;overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:2px}
.krow{display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px solid var(--grid)}
.krow:first-of-type{border-top:none}
.kname{font-size:11.5px;color:var(--ink-2);flex:1;min-width:0}
.kval{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.kdelta{width:54px;text-align:right}
.dept .drill{margin-top:9px;font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.dept:hover .drill{color:var(--accent)}
.status-chip{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  font-weight:650;padding:2px 7px;border-radius:var(--r);border:1px solid;white-space:nowrap}
.status-chip.good{color:var(--good);border-color:rgba(12,163,12,.3)}
.status-chip.warning{color:var(--warning);border-color:rgba(250,178,25,.3)}
.status-chip.serious{color:var(--serious);border-color:rgba(236,131,90,.35)}
.status-chip.critical{color:var(--critical);border-color:rgba(208,59,59,.35)}

/* ================= ALERT RAIL ================= */
.rail{position:sticky;top:44px;align-self:start;max-height:calc(100vh - 58px);display:flex;flex-direction:column;min-width:0}
.rail .card{display:flex;flex-direction:column;min-height:0;flex:1}
.alert-list{overflow-y:auto;margin-top:9px;display:flex;flex-direction:column;gap:7px;padding-right:2px;scrollbar-width:thin}
.alert{display:flex;gap:9px;padding:9px 10px;background:var(--raised);border:1px solid var(--hairline);border-radius:var(--r)}
.alert .stripe{width:2px;border-radius:1px;flex:none}
.alert.critical .stripe{background:var(--critical)} .alert.serious .stripe{background:var(--serious)}
.alert.warning .stripe{background:var(--warning)} .alert.good .stripe{background:var(--good)}
.alert .a-body{flex:1;min-width:0}
.alert .a-top{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.alert .a-time{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.alert .a-msg{font-size:11.5px;color:var(--ink-2);line-height:1.45}
.alert .a-src{margin-top:4px;font-size:10px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.05em}
.alert.enter{animation:slidein .3s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* ================= DEPARTMENT PAGE ================= */
.dept-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dept-head h2{font-size:16px;font-weight:650;letter-spacing:0;text-transform:none;color:var(--ink)}
.dept-head .score-big{font-family:var(--mono);font-size:22px;font-weight:700}
.back{font-size:11px;font-family:var(--mono);color:var(--ink-3);padding:3px 9px;border:1px solid var(--hairline);border-radius:var(--r)}
.back:hover{color:var(--ink);background:var(--raised)}
.edit-btn{margin-left:auto}
.edit-btn.on{color:var(--warning);border-color:rgba(250,178,25,.4)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:960px){.two-col{grid-template-columns:1fr}}
.kpi-edit{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--grid)}
.kpi-edit:first-of-type{border-top:none}
.kpi-edit .kname{flex:1}
input.field,select.field{background:var(--raised);color:var(--ink);border:1px solid #33363c;border-radius:var(--r);
  padding:3px 7px;font-family:var(--mono);font-size:12px;width:88px}
input.field.wide{width:100%;font-family:var(--sans)}
input.field:focus{border-color:var(--accent);outline:none}
.proj-table{width:100%;border-collapse:collapse;font-size:12px}
.proj-table th{text-align:left;color:var(--ink-3);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--hairline);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
.proj-table td{padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
.proj-table td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.proj-table .pname{font-weight:600;color:var(--ink)}
.proj-table .pdesc{font-size:11px;color:var(--ink-3);margin-top:2px}
.pbar{height:3px;border-radius:2px;background:#24262b;position:relative;min-width:70px}
.pbar .pfill{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--accent)}
.row-del{color:var(--ink-3);font-size:13px;padding:1px 7px;border:1px solid var(--hairline);border-radius:var(--r)}
.row-del:hover{color:var(--critical);border-color:rgba(208,59,59,.4)}
.add-row{margin-top:9px;font-size:11px;font-family:var(--mono);color:var(--ink-2);padding:4px 10px;border:1px dashed #33363c;border-radius:var(--r)}
.add-row:hover{color:var(--ink);border-color:var(--accent)}
.editbar{display:flex;gap:8px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--grid)}
.save-btn{background:#1c5cab;color:#fff;border:none;padding:5px 16px;border-radius:var(--r);font-size:12px;font-weight:600}
.save-btn:hover{background:#2a6ec2}
.editnote{font-size:10.5px;color:var(--ink-3)}
footer{padding:10px 22px 26px;text-align:center;font-size:10.5px;color:var(--ink-3)}
footer span{font-family:var(--mono)}
</style>
</head>

/* =====================================================================
   DATA ENGINE — deterministic seeded series (730 days, daily)
   ===================================================================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(20260706);
const DAY = 864e5, NOW = new Date();
const N_DAYS = 730;
const t0 = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate()).getTime() - (N_DAYS-1)*DAY;
function seasonal(ts){
  const d = new Date(ts), doy = (ts - new Date(d.getFullYear(),0,0).getTime())/DAY;
  const season = 1 + 0.26*Math.cos(2*Math.PI*(doy-15)/365.25);
  const dow = d.getDay(), wk = (dow===0||dow===6) ? 0.52 : 1 + (dow===1?0.10:0) + (dow===4?0.06:0);
  return {season, wk};
}
const baseDaily = PACK.company.fyNetSalesM/365;
const days=[], actual=[], plan=[];
{
  let drift = 0;
  for(let i=0;i<N_DAYS;i++){
    const ts = t0 + i*DAY, {season, wk} = seasonal(ts);
    const growth = Math.pow(1.045, i/365);
    drift = drift*0.92 + (rng()-0.5)*0.05;
    const p = baseDaily*season*wk*growth;
    const recentLift = i > N_DAYS-120 ? 0.021 : 0;
    const a = p * (1 + drift*0.6 + (rng()-0.5)*0.09 + 0.008 + recentLift);
    days.push(ts); plan.push(p); actual.push(Math.max(0.4, a));
  }
}
function metricSeries(start,end,noise,n=90,seed=7){
  const r=mulberry32(seed*7919+13); const out=[];
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    out.push(start+(end-start)*(t*t*(3-2*t)) + (r()-0.5)*2*noise);
  }
  out[n-1]=end; return out;
}
const fmtM = v => "$"+v.toFixed(2)+"M";
const fmtDate = ts => new Date(ts).toLocaleDateString("en-US",{month:"short",day:"numeric"});
const fmtDateY = ts => new Date(ts).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const num = s => { const m=String(s).replace(/[^0-9.\-]/g,""); const v=parseFloat(m); return isNaN(v)?null:v; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* =====================================================================
   CHART HELPERS (SVG, hand-rolled)
   ===================================================================== */
const SVGNS="http://www.w3.org/2000/svg";
function el(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function niceTicks(max,n){const raw=max/n,mag=Math.pow(10,Math.floor(Math.log10(raw)));const norm=raw/mag;const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;const out=[];for(let v=0;v<=max+1e-9;v+=step)out.push(v);return out}
function sparkline(values, w=120, h=26, accentLast=true){
  const svg=document.createElementNS(SVGNS,"svg");
  svg.setAttribute("width",w);svg.setAttribute("height",h);svg.setAttribute("aria-hidden","true");
  const mn=Math.min(...values),mx=Math.max(...values),pad=3;
  const x=i=>pad+i*(w-2*pad)/(values.length-1);
  const y=v=>mx===mn? h/2 : h-pad-(v-mn)*(h-2*pad)/(mx-mn);
  const d=values.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  el("path",{d,fill:"none",stroke:"#3a3f47","stroke-width":2,"stroke-linecap":"round","stroke-linejoin":"round"},svg);
  if(accentLast){
    const i=values.length-1;
    el("circle",{cx:x(i),cy:y(values[i]),r:4.5,fill:"#121316"},svg);
    el("circle",{cx:x(i),cy:y(values[i]),r:3,fill:"var(--accent)"},svg);
  }
  return svg;
}
function lineChart(host,tipEl,series,opts){
  host.innerHTML="";
  const n=series[0].vals.length;
  const W=host.clientWidth||820, H=opts.h||260, M={t:12,r:16,b:28,l:48};
  const iw=W-M.l-M.r, ih=H-M.t-M.b;
  const all=series.flatMap(s=>s.vals);
  let ymin=opts.zeroBase?0:Math.min(...all), ymax=Math.max(...all);
  const span=(ymax-ymin)||1; if(!opts.zeroBase){ymin-=span*.15;ymax+=span*.1}else{ymax*=1.08}
  const X=i=>M.l+i*iw/(n-1), Y=v=>M.t+ih-((v-ymin)/(ymax-ymin))*ih;
  const svg=el("svg",{width:"100%",height:H,viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":opts.aria||"line chart"});
  host.appendChild(svg);
  const yt=opts.zeroBase?niceTicks(ymax,4):[ymin,ymin+span*.5,ymax];
  yt.forEach(v=>{
    el("line",{x1:M.l,x2:W-M.r,y1:Y(v),y2:Y(v),stroke:"var(--grid)","stroke-width":1},svg);
    const t=el("text",{x:M.l-8,y:Y(v)+4,"text-anchor":"end",fill:"#5f6672","font-size":10,"font-family":"var(--mono)"},svg);
    t.textContent=opts.yfmt(v);
  });
  const nx=Math.min(6,n);
  for(let k=0;k<nx;k++){
    const i=Math.round(k*(n-1)/(nx-1));
    const t=el("text",{x:X(i),y:H-7,"text-anchor":"middle",fill:"#5f6672","font-size":10,"font-family":"var(--mono)"},svg);
    t.textContent=opts.xlabel(i);
  }
  if(opts.area){
    const a=series[0].vals;
    const areaD="M"+X(0)+" "+Y(a[0])+a.map((v,i)=>"L"+X(i)+" "+Y(v)).join("")+`L${X(n-1)} ${M.t+ih}L${X(0)} ${M.t+ih}Z`;
    el("path",{d:areaD,fill:series[0].color,"fill-opacity":.08},svg);
  }
  [...series].reverse().forEach(s=>{
    el("path",{d:s.vals.map((v,i)=>(i?"L":"M")+X(i)+" "+Y(v)).join(""),fill:"none",stroke:s.color,"stroke-width":2,"stroke-linecap":"round","stroke-linejoin":"round"},svg);
  });
  const s0=series[0], last=s0.vals[n-1];
  el("circle",{cx:X(n-1),cy:Y(last),r:5.5,fill:"#121316"},svg);
  el("circle",{cx:X(n-1),cy:Y(last),r:3.5,fill:s0.color},svg);
  const lbl=el("text",{x:X(n-1)-8,y:Y(last)-9,"text-anchor":"end",fill:"#e8eaed","font-size":10.5,"font-family":"var(--mono)","font-weight":600},svg);
  lbl.textContent=opts.yfmt(last);
  const cross=el("line",{y1:M.t,y2:M.t+ih,stroke:"#383c44","stroke-width":1,visibility:"hidden"},svg);
  const dots=series.map(s=>el("circle",{r:3.5,fill:s.color,stroke:"#121316","stroke-width":2,visibility:"hidden"},svg));
  const hit=el("rect",{x:M.l,y:M.t,width:iw,height:ih,fill:"transparent"},svg);
  hit.addEventListener("mousemove",ev=>{
    const r=svg.getBoundingClientRect(), sx=(ev.clientX-r.left)*(W/r.width);
    const i=Math.max(0,Math.min(n-1,Math.round((sx-M.l)/(iw/(n-1)))));
    cross.setAttribute("x1",X(i));cross.setAttribute("x2",X(i));cross.setAttribute("visibility","visible");
    series.forEach((s,si)=>{dots[si].setAttribute("cx",X(i));dots[si].setAttribute("cy",Y(s.vals[i]));dots[si].setAttribute("visibility","visible")});
    tipEl.style.display="block";
    const hostR=host.getBoundingClientRect();
    let px=ev.clientX-hostR.left+14; if(px>hostR.width-180)px=ev.clientX-hostR.left-180;
    tipEl.style.left=px+"px"; tipEl.style.top=(ev.clientY-hostR.top-10)+"px";
    tipEl.innerHTML=`<div class="tt-date">${opts.tipTitle(i)}</div>`+
      series.map(s=>`<div class="tt-row"><span style="width:8px;height:8px;border-radius:2px;background:${s.color}"></span>${s.name}<span class="v">${opts.yfmt(s.vals[i])}</span></div>`).join("")+
      (opts.tipExtra?opts.tipExtra(i):"");
  });
  hit.addEventListener("mouseleave",()=>{tipEl.style.display="none";cross.setAttribute("visibility","hidden");dots.forEach(d=>d.setAttribute("visibility","hidden"))});
}

function drawShare(){

  const rowsN=PACK.segments.length, comp=PACK.competitors;
  const W=host.clientWidth||820, rowH=18, gapY=16, M={t:6,r:14,b:4,l:104};
  const H=M.t+rowsN*(rowH+gapY)-gapY+M.b;

  const svg=el("svg",{width:"100%",height:H,viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Market share by demand space, stacked bars"});
  host.appendChild(svg);
  const tip=document.getElementById("shareTip");
  PACK.segments.forEach((seg,ri)=>{
    const y=M.t+ri*(rowH+gapY);
    const t=el("text",{x:M.l-12,y:y+rowH/2+4,"text-anchor":"end",fill:"#9aa1ac","font-size":11.5},svg);
    t.textContent=seg;
    let x=M.l;
    comp.forEach(c=>{
      const pct=PACK.share[seg][c.id]||0; if(!pct)return;
      const wpx=pct/100*iw - 2;
      if(wpx<=0)return;
      const r=el("rect",{x:x,y:y,width:Math.max(1,wpx),height:rowH,fill:c.hex,rx:2},svg);
      if(wpx>40){

          fill:(c.id==="btb"||c.id==="knorr")?"#0b0b0b":"#ffffff"},svg);
        lt.textContent=pct+"%";

        let px=ev.clientX-hostR.left+14; if(px>hostR.width-210)px=ev.clientX-hostR.left-210;
        tip.style.left=px+"px"; tip.style.top=(ev.clientY-hostR.top-8)+"px";

const tickState=PACK.ticker.map(t=>({...t,val:t.base,chg:0}));
function renderTicker(){
  const host=document.getElementById("ticker");host.innerHTML="";
  tickState.forEach((t,i)=>{
    const d=document.createElement("div");d.className="tick";d.id="tick-"+i;d.title=t.label;
    host.appendChild(d);
  });
  paintTicker();
}
function paintTicker(flashIdx){
  tickState.forEach((t,i)=>{
    const d=document.getElementById("tick-"+i); if(!d)return;
    const cls=t.chg>0.02?"up":t.chg<-0.02?"dn":"flat";
    const arrow=t.chg>0.02?"▲":t.chg<-0.02?"▼":"·";
    d.innerHTML=`<span class="sym">${t.sym}</span><span class="val">${t.fmt(t.val)}</span>
      <span class="chg ${cls}">${arrow} ${Math.abs(t.chg).toFixed(2)}%</span>`;
    d.classList.toggle("flash",i===flashIdx);
  });
}
function tickTicker(){
  const i=Math.floor(Math.random()*tickState.length);
  const t=tickState[i];
  const move=(rng()-0.48)*2*t.vol*t.base;
  t.val=Math.max(0,t.val+move);
  t.chg=(t.val/t.base-1)*100;
  paintTicker(i);
  setTimeout(tickTicker, 1400+Math.random()*2200);
}
let heroRun = actual[actual.length-1]*0.63;
function tickHeroNow(){
  const hv=document.getElementById("heroVal"); if(!hv)return;
  const planToday=plan[plan.length-1];
  hv.textContent="$"+heroRun.toFixed(2);
  document.getElementById("heroPlan").textContent=planToday.toFixed(2);
  const pace=heroRun/(planToday*0.66);
  const dd=document.getElementById("heroDelta");
  dd.textContent=(pace>=1?"▲ +":"▼ −")+Math.abs((pace-1)*100).toFixed(1)+"% vs pace";
  dd.className="delta "+(pace>=1?"up":"dn");
}
function tickHero(){
  const planToday=plan[plan.length-1];
  heroRun += planToday*0.0006*(0.7+rng()*0.8);
  tickHeroNow();
  setTimeout(tickHero,2000);
}
function tickClock(){
  const n=new Date();
  document.getElementById("clock").textContent=
    n.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})+" "+
    n.toLocaleTimeString("en-US",{hour12:false});
  setTimeout(tickClock,1000);
}
